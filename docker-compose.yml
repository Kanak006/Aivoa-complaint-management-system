version: "3.8"
services:
  postgres:
    image: postgres:16
    container_name: aivoa_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aivoa_complaints
    ports:
      - "5432:5432"
    volumes:
      - aivoa_pgdata:/var/lib/postgresql/data

volumes:
  aivoa_pgdata:
